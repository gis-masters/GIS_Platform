spring:
  profiles:
    active: fiz-dev
logging:
  file: /opt/crg/logs/data-service.log
  level:
    ru.mycrg: DEBUG

---

server:
  port: 8090

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5434/crg_report_service
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: 50000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    placeholders:
      db_owner: ${SPRING_FLYWAY_PLACEHOLDERS_DB_OWNER}
  servlet:
    multipart:
      max-file-size: 51MB
      max-request-size: 51MB

crg-options:
  data_service_url: http://127.0.0.1:8084
  carbone:
    url: ${CRG_OPTIONS_CARBONE_URL:http://127.0.0.1:4000}
    lang: ${CRG_OPTIONS_CARBONE_LANG:ru}
    timezone: ${CRG_OPTIONS_CARBONE_TIMEZONE:Europe/Moscow}
  jwt:
    secret: your_jwt_secret_here
