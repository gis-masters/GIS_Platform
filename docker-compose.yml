version: '3.7'

services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
#    environment:
#      RABBITMQ_DEFAULT_USER: $CRG_USER
#      RABBITMQ_DEFAULT_PASS: $RABBIT_PASS

  database:
    container_name: database
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: gis_portal
      POSTGRES_PASSWORD: $DB_PASS
    ports:
      - "5432:5432"


  postgis:
    container_name: postgis
    image: kartoza/postgis
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: $CRG_USER
      POSTGRES_PASS: $DB_PASS
      ALLOW_IP_RANGE: 0.0.0.0/0

  geoserver:
    container_name: geoserver
    image: $DOCKER_CRG_HOST/geoserver:1.0.2
    ports:
      - "8080:8080"
    volumes:
      - /opt/docker-scripts/setenv.sh:/usr/local/tomcat/bin/setenv.sh





  apm-server:
    container_name: apm-server
    image: docker.elastic.co/apm/apm-server:7.0.1
    ports:
      - "8200:8200"
    volumes:
      - /opt/apm-server-7.0.1-linux-x86_64/apm-server.yml:/usr/share/apm-server/apm-server.yml

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:7.0.1
    volumes:
      - /opt/elastics-config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      ES_JAVA_OPTS: "-Xmx256m -Xms256m"

  logstash:
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:7.0.1
    volumes:
      - /opt/elastics-config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - /opt/elastics-config/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5000:5000"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    depends_on:
      - elasticsearch

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:7.0.1
    volumes:
      - /opt/elastics-config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch





  registry:
    container_name: crg-registry
    image: $DOCKER_CRG_HOST/crg-registry
    restart: always
    ports:
      - 8761:8761
    volumes:
      - /opt/logs:/opt/logs
      - /opt/elastic-apm-agent:/opt/elastic-apm-agent
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  jwt-service:
    container_name: jwt-service
    image: $DOCKER_CRG_HOST/jwt-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/gis_portal
    volumes:
      - /opt/logs:/opt/logs
      - /opt/elastic-apm-agent:/opt/elastic-apm-agent
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  gateway:
    container_name: crg-gateway
    image: $DOCKER_CRG_HOST/crg-gateway
    restart: always
    depends_on:
      - registry
    ports:
      - 8100:8100
    volumes:
      - /opt/logs:/opt/logs
      - /opt/elastic-apm-agent:/opt/elastic-apm-agent
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  geo-api:
    container_name: geo-api
    image: $DOCKER_CRG_HOST/geo-api
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/gis_portal
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_FLYWAY_URL: jdbc:postgresql://database:5432/gis_portal
      POSTGIS_HOST: postgis:5432
      POSTGIS_USER: $CRG_USER
      POSTGIS_PASSWORD: $DB_PASS
    healthcheck:
      test: ["CMD", "curl", "-f", "http://geo-api:8088/actuator/health"]
      interval: 30s
      timeout: 60s
      retries: 5
    ports:
      - "8088:8088"
    volumes:
      - /opt/fgistp:/opt/fgistp
      - /opt/gml:/opt/gml
      - /opt/logs:/opt/logs
      - /opt/elastic-apm-agent:/opt/elastic-apm-agent
    depends_on:
      - database
      - rabbitmq
      - geoserver
      - postgis
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  geo-wrapper:
    container_name: geo-wrapper
    image: $DOCKER_CRG_HOST/geo-wrapper
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/postgres
      SPRING_DATASOURCE_USERNAME: $CRG_USER
      SPRING_DATASOURCE_PASSWORD: $DB_PASS
      SPRING_RABBITMQ_HOST: rabbitmq
      CRG_OPTIONS_GEOSERVER_HOST: gateway:8100
      CRG_OPTIONS_GEOSERVER_USER: $GEOSERVER_USER
      CRG_OPTIONS_GEOSERVER_PASSWORD: $GEOSERVER_PASSWORD
      CRG_OPTIONS_POSTGIS_HOST: postgis:5432
    depends_on:
      - rabbitmq
      - geo-api
    volumes:
      - /opt/fgistp:/opt/fgistp
      - /opt/gml:/opt/gml
      - /opt/logs:/opt/logs
      - /opt/elastic-apm-agent:/opt/elastic-apm-agent
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  portal-ui:
    container_name: crg-ui
    image: $DOCKER_CRG_HOST/crg-ui
    restart: always
    depends_on:
    - geo-api
    - geoserver
    volumes:
      - /opt/nginx/conf.d:/etc/nginx/conf.d
    ports:
    - 80:80
