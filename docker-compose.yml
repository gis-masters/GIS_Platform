version: '3.7'

services:
  rabbitmq:
    container_name: rabbitmq
    image: $DOCKER_CRG_HOST/rabbitmq:$RABBIT_TAG
    restart: always
    labels: 
       co.elastic.metrics/raw: "[{\"enabled\":true,\"metricsets\":[\"node\",\"queue\",\"exchange\"],\"module\":\"rabbitmq\",\"hosts\":[\"localhost:15672\"],\"username\":\"$CRG_USER\",\"password\":\"$RABBIT_PASS\"}]"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: $CRG_USER
      RABBITMQ_DEFAULT_PASS: $RABBIT_PASS

  database:
    container_name: database
    image: $DOCKER_CRG_HOST/postgres:$POSTGRES_TAG
    restart: always
    labels: 
      co.elastic.metrics/raw: "[{\"enabled\":true,\"metricsets\":[\"database\",\"bgwriter\",\"activity\",\"statement\"],\"module\":\"postgresql\",\"hosts\":[\"postgres://localhost:5432?sslmode=disable\"],\"username\":\"postgres\",\"password\":\"$DB_PASS\"}]"
    environment:
      POSTGRES_DB: gis_portal
      POSTGRES_PASSWORD: $DB_PASS
    ports:
      - "5432:5432"
    volumes:
      - /opt/data/postgres:/var/lib/postgresql/data


  postgis:
    container_name: postgis
    image: $DOCKER_CRG_HOST/postgis:$POSTGIS_TAG
    labels:
      co.elastic.metrics/raw: "[{\"enabled\":true,\"metricsets\":[\"database\",\"bgwriter\",\"activity\",\"statement\"],\"module\":\"postgresql\",\"hosts\":[\"postgres://localhost:5434?sslmode=disable\"],\"username\":\"$CRG_USER\",\"password\":\"$DB_PASS\"}]"
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - /opt/data/postgis:/var/lib/postgresql
    environment:
      POSTGRES_DBNAME: crg_auth_service,crg_gis_service
      POSTGRES_USER: $CRG_USER
      POSTGRES_PASS: $DB_PASS
      EXISTING_DATA_DIR: $IS_DATA_EXIST

  geoserver:
    container_name: geoserver
    image: $DOCKER_CRG_HOST/geoserver:$GEOSERVER_TAG
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /opt/data/geoserver:/opt/geoserver/data_dir
      - /opt/gwc_storage:/opt/gwc_storage
    environment:
      APM_URL: ${APM_URL}
      GEOSERVER_ADMIN_PASSWORD: $GEOSERVER_PASSWORD
      INITIAL_MEMORY: ${JAVA_XMS_SIZE}
      MAXIMUM_MEMORY: ${JAVA_XMX_SIZE}


  auth-service:
    container_name: crg-auth
    image: $DOCKER_CRG_HOST/auth-service:$CRG_AUTH_TAG
    restart: always
    extra_hosts:
      - "logstash:${LOGSTASH_HOST}"
    environment:
      APM_URL: ${APM_URL}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/crg_auth_service
      SPRING_DATASOURCE_USERNAME: $CRG_USER
      SPRING_DATASOURCE_PASSWORD: $DB_PASS

      SPRING_FLYWAY_URL: jdbc:postgresql://postgis:5432/crg_auth_service
      SPRING_FLYWAY_USER: $CRG_USER
      SPRING_FLYWAY_PASSWORD: $DB_PASS

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: $CRG_USER
      SPRING_RABBITMQ_PASSWORD: $RABBIT_PASS
    volumes:
      - /opt/logs:/opt/logs
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  gis-service:
    container_name: crg-gis-service
    image: $DOCKER_CRG_HOST/crg-gis-service:$CRG_GIS_SERVICE_TAG
    restart: always
    extra_hosts:
      - "logstash:${LOGSTASH_HOST}"
    environment:
      APM_URL: ${APM_URL}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/crg_gis_service
      SPRING_DATASOURCE_USERNAME: $CRG_USER
      SPRING_DATASOURCE_PASSWORD: $DB_PASS

      SPRING_FLYWAY_URL: jdbc:postgresql://postgis:5432/crg_gis_service
      SPRING_FLYWAY_USER: $CRG_USER
      SPRING_FLYWAY_PASSWORD: $DB_PASS

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: $CRG_USER
      SPRING_RABBITMQ_PASSWORD: $RABBIT_PASS

      CRG_OPTIONS_CLIENT_ID: admin
      CRG_OPTIONS_CLIENT_SECRET: geoserver

      CRG_OPTIONS_ROOT_USER_NAME: $GEOSERVER_USER
      CRG_OPTIONS_ROOT_USER_PASSWORD: $GEOSERVER_PASSWORD

      CRG_OPTIONS_AUTH_SERVICE_URL: http://auth-service:9000
      CRG_OPTIONS_GEOSERVER_HOST: geoserver:8080
      CRG_OPTIONS_USER_SERVICE_NAME: postgres_db_user_service
    volumes:
      - /opt/logs:/opt/logs
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  gateway:
    container_name: crg-gateway
    image: $DOCKER_CRG_HOST/crg-gateway:$CRG_GATEWAY_TAG
    restart: always
    extra_hosts:
     - "logstash:${LOGSTASH_HOST}"
    environment:
      APM_URL: ${APM_URL}
    ports:
      - 8100:8100
    volumes:
      - /opt/logs:/opt/logs
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  geo-api:
    container_name: geo-api
    image: $DOCKER_CRG_HOST/geo-api:$CRG_API_TAG
    restart: always
    extra_hosts:
     - "logstash:${LOGSTASH_HOST}"
    environment:
      APM_URL: ${APM_URL}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/gis_portal
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: $CRG_USER
      SPRING_RABBITMQ_PASSWORD: $RABBIT_PASS
      SPRING_FLYWAY_URL: jdbc:postgresql://database:5432/gis_portal

      POSTGIS_HOST: postgis:5432
      POSTGIS_USER: $CRG_USER
      POSTGIS_PASSWORD: $DB_PASS
      CRG_OPTIONS_GIS_DB_URL: jdbc:postgresql://postgis:5432/
      CRG_OPTIONS_GIS_DB_USER: $CRG_USER
      CRG_OPTIONS_GIS_DB_PASSWORD: $DB_PASS
      CRG_OPTIONS_EXPORT_STORAGE_PATH: /opt/export/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://geo-api:8088/actuator/health"]
      interval: 30s
      timeout: 60s
      retries: 5
    ports:
      - "8088:8088"
    volumes:
      - /opt/fgistp:/opt/fgistp
      - /opt/export:/opt/export
      - /opt/logs:/opt/logs
    depends_on:
      - database
      - rabbitmq
      - geoserver
      - postgis
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  geo-wrapper:
    container_name: geo-wrapper
    image: $DOCKER_CRG_HOST/geo-wrapper:$CRG_WRAPPER_TAG
    restart: always
    extra_hosts:
     - "logstash:${LOGSTASH_HOST}"
    environment:
      APM_URL: ${APM_URL}

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/postgres
      SPRING_DATASOURCE_USERNAME: $CRG_USER
      SPRING_DATASOURCE_PASSWORD: $DB_PASS
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: $CRG_USER
      SPRING_RABBITMQ_PASSWORD: $RABBIT_PASS

      CRG_OPTIONS_CLIENT_ID: admin
      CRG_OPTIONS_CLIENT_SECRET: geoserver

      CRG_OPTIONS_ROOT_USER_NAME: $GEOSERVER_USER
      CRG_OPTIONS_ROOT_USER_PASSWORD: $GEOSERVER_PASSWORD

      CRG_OPTIONS_AUTH_SERVICE_URL: http://auth-service:9000
      CRG_OPTIONS_GIS_SERVICE_URL: http://gis-service:8082
      CRG_OPTIONS_GEOSERVER_HOST: geoserver:8080
      CRG_OPTIONS_USER_SERVICE_NAME: postgres_db_user_service

      CRG_OPTIONS_EXPORT_STORAGE_PATH: /opt/export/
    depends_on:
      - rabbitmq
      - geo-api
    volumes:
      - /opt/fgistp:/opt/fgistp
      - /opt/export:/opt/export
      - /opt/logs:/opt/logs
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  portal-ui:
    container_name: crg-ui
    image: $DOCKER_CRG_HOST/crg-ui:$CRG_UI_TAG
    restart: always
    environment:
      UI_PLATFORM: $UI_PLATFORM
      UI_PROD: $UI_PROD
      UI_SERVER_HOST: $UI_SERVER_HOST
      UI_SERVER_PORT: $UI_SERVER_PORT
      UI_SWN: $UI_SWN
      UI_WS_PORT: $UI_WS_PORT
    depends_on:
      - geo-api
      - geoserver
    volumes:
      - /opt/reglaments:/usr/share/nginx/html/reglaments
    ports:
    - 80:80
