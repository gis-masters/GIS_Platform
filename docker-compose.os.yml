version: '3.7'

services:
  geoserver:
    container_name: geoserver
    image: ${DOCKER_CRG_HOST}/geoserver:${GEOSERVER_TAG}
    restart: always
    healthcheck:
      test: curl -f http://localhost:8080/geoserver || exit 1
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
    ports:
      - "8080:8080"
    volumes:
      - /opt/crg/data/geoserver:/opt/geoserver/data_dir
      - /opt/crg/gwc_storage:/opt/crg/gwc_storage
      - /opt/crg/spatial_data:/opt/crg/spatial_data
      - /opt/crg/file_storage:/opt/crg/file_storage
    environment:
      APM_URL: ${APM_URL}

      INITIAL_MEMORY: ${GEOSERVER_XMS_SIZE:-20G}
      MAXIMUM_MEMORY: ${GEOSERVER_XMX_SIZE:-20G}

      STABLE_EXTENSIONS: importer-plugin,jp2k-plugin
      COMMUNITY_EXTENSIONS: ogr-datastore-plugin,jdbcconfig-plugin,jdbcstore-plugin
    mem_limit: ${GEOSERVER_MEM_LIMIT:-21000}m

  postgis:
    container_name: postgis
    image: ${DOCKER_CRG_HOST}/postgis:${POSTGIS_TAG}
    shm_size: ${SHM_SIZE:-2g}
    labels:
      co.elastic.metrics/raw: "[{\"enabled\":true,\"metricsets\":[\"database\",\"bgwriter\",\"activity\",\"statement\"],\"module\":\"postgresql\",\"hosts\":[\"postgres://localhost:5434/crg_auth_service?sslmode=disable\"],\"username\":\"$CRG_USER\",\"password\":\"$DB_PASS\"}]"
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - /opt/crg/data/postgis:/var/lib/postgresql
      - /opt/crg/data/configs/db/extra.conf:/settings/extra.conf
    environment:
      POSTGRES_DBNAME: crg_notification_db,crg_auth_service,crg_gis_service,crg_data_service,geoserver_db,bpmn_camunda,crg_audit_service,gsstore,gscatalog
      POSTGRES_USER: ${CRG_USER}
      POSTGRES_PASS: ${DB_PASS}
      RECREATE_DATADIR: ${RECREATE_DATADIR}
    mem_limit: ${POSTGIS_MEM_LIMIT:-2100}m

  rabbitmq:
    container_name: rabbitmq
    image: ${DOCKER_CRG_HOST}/rabbitmq:${RABBIT_TAG}
    restart: always
    labels:
      co.elastic.metrics/raw: "[{\"enabled\":true,\"metricsets\":[\"node\",\"queue\",\"exchange\"],\"module\":\"rabbitmq\",\"hosts\":[\"localhost:15672\"],\"username\":\"$CRG_USER\",\"password\":\"$RABBIT_PASS\"}]"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    mem_limit: ${RABBITMQ_MEM_LIMIT:-20000}m

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - /opt/crg/data/redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASS}
    command: redis-server --requirepass ${REDIS_PASS}
    mem_limit: ${REDIS_MEM_LIMIT:-500}m
    privileged: true
