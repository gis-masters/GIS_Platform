<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="refresh" content="30"/>
  <title>Технические работы</title>

  <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
          background: #fff;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #333;
          padding: 20px;
      }

      .container {
          background: #fff;
          border-radius: 22px;
          padding: 50px 44px 50px;
          max-width: 620px;
          width: 100%;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
          text-align: center;
          animation: fadeIn 0.5s ease-in;
      }

      @keyframes fadeIn {
          from {
              opacity: 0;
              transform: translateY(-16px);
          }
          to {
              opacity: 1;
              transform: translateY(0);
          }
      }

      .icon {
          width: 112px;
          height: 112px;
          margin: 0 auto 22px;
          background: #1976d2;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          animation: pulse 2s infinite;
      }

      @keyframes pulse {
          0%, 100% {
              transform: scale(1);
          }
          50% {
              transform: scale(1.05);
          }
      }

      .icon svg {
          width: 56px;
          height: 56px;
          fill: #fff;
      }

      h1 {
          font-size: 34px;
          margin-bottom: 14px;
          color: #2d3748;
          font-weight: 700;
          letter-spacing: -0.2px;
      }

      .message {
          font-size: 17px;
          line-height: 1.6;
          color: #4a5568;
          max-width: 480px;
          margin: 0 auto;
      }

      .status {
          margin-top: 26px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          padding: 10px 14px;
          border-radius: 14px;
      }

      .loader {
          width: 50px;
          height: 50px;
          border: 3px solid rgba(45, 55, 72, 0.18);
          border-top-color: #1976d2;
          border-radius: 50%;
          animation: spin 3s linear infinite;
          flex: 0 0 auto;
      }

      @keyframes spin {
          to {
              transform: rotate(360deg);
          }
      }

      .countdown .time {
          display: inline-block;
          min-width: 52px;
          text-align: center;
          padding: 4px 10px;
          margin-left: 6px;
          border-radius: 10px;
          background: rgba(25, 118, 210, 0.12);
          color: #1976d2;
          font-weight: 800;
          font-variant-numeric: tabular-nums;
          letter-spacing: 0.2px;
      }

      .footer {
          margin-top: 36px;
          font-size: 12px;
          color: rgba(113, 128, 150, 0.9);
      }

      @media (max-width: 520px) {
          .container {
              padding: 40px 22px 40px;
          }

          h1 {
              font-size: 30px;
          }

          .message {
              font-size: 16px;
          }
      }
  </style>
</head>

<body>
<div class="container">
  <div class="icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
    </svg>
  </div>

  <h1>Технические работы</h1>

  <div class="message" id="message">
    В настоящее время на платформе ведутся технические работы.
    Мы приносим извинения за временные неудобства.<br>
    <!--{%additional text%}-->
  </div>

  <div class="status" aria-live="polite">
    <div class="loader" aria-hidden="true"></div>
  </div>


  <div class="footer">Мы работаем над улучшением сервиса для вас</div>
</div>

<script>
  setTimeout(() => {
    location.reload();
  }, 30000);
</script>
</body>
</html>
