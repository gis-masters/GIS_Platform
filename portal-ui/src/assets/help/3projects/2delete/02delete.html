<p>
  Удаление проекта производится на странице <i>«Проекты»</i>.
</p>

<ol>
  <li>
    Для удаления проекта наведите указатель мыши на подлежащий удалению проект.
  </li>
  <li>
    Нажмите на иконку <i>«Удалить проект»</i>.
  </li>
  <center><img src="02delete_1.png" alt=""></center>
  <li>
    Подтвердите удаление проекта.
  </li>
  <center><img src="02delete_2.png" alt=""></center>
</ol>
