<p>
  Для распечатки фрагмента карты требуется:
</p>
<ol>
  <li>
    На верхней панели кликнуть ЛКМ на значок <i>«Печать»</i><img src="00print_1.png" alt="">.
  </li>
  <li>
    В появившемся окне выбрать нужные параметры, а затем нажать на кнопку <i>«Печать»</i>.
    Разрешение dpi означает количество точек (пикселей) на дюйм.
  </li>
</ol>
