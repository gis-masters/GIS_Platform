<p>
  Создание проекта производится на странице <i>«Проекты»</i>.
</p>

<ol>
  <li>
    Нажать на форму <i>«Создать новый проект»</i>.
    <img src="01create_1.png" alt="">
  </li>
  <li>
    Ввести название проекта, который создаём.
  </li>
  <li>
    Нажать <i>«Сохранить»</i>.
  </li>
</ol>

<p>
  Проект создан и отображается в списке проектов.
</p>

<img src="01create_2.png" alt="">
