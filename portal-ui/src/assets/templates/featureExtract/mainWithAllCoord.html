<table width="425px">
  <tr>
    <td colspan="10" style="text-align: center; font-size: 10px">
      <span style="color: grey">Выписка об объекте</span>
      {{title}}
    </td>
  </tr>
  <tr>
    <td colspan="10" style="text-align: right">
      <span style="font-size: 8px">{{currentDate}}</span>
    </td>
  </tr>
  <tr>
    <td colspan="10"><img style="width: 100%; height: auto" src="{{image}}" alt="" /></td>
  </tr>
  <tr>
    <td colspan="10">
      <table style="font-size: 7px; width: 100%;">
        <tr>
          <td style="color: grey; text-align: center" colspan="2">Характеристики объекта</td>
        </tr>
        {{properties}}
      </table>
    </td>
  </tr>
    <tr>
    <td colspan="10">
       <table style="font-size: 7px; width: 100%;"> 
        <tr>
          <td style="color: grey; text-align: center" colspan="2">Ведомость координат</td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td colspan="3" style="text-align: center">
      <table style="font-size: 7px; border-collapse: collapse">
        <tr>
          <td style="padding-left: 3px" colspan="3">
            <span style="color: grey">Система координат:</span>
            {{crs}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr style="padding-left: 10px">
    <tr>
      <td colspan="3" style="font-size: 7px; padding-left: 4px">
        <span style="color: #808080">{{areaType}}: </span>
        <span >{{areaSize}} {{units}}</span>
      </td>
    </tr>
  </tr>
</table>

<table width="425px" style="border: none; border-collapse: collapse; font-size: 7px">
  <tr>
    <td colspan="9" style="border: none;">
      <table style="font-size: 6px; width: 100%; border-collapse: collapse; border: none;">
        <tr style="color: grey">
          <th style="text-align: center">№</th>
          <th style="text-align: center">X</th>
          <th style="text-align: center">Y</th>
          <th style="text-align: center">№</th>
          <th style="text-align: center">X</th>
          <th style="text-align: center">Y</th>
          <th style="text-align: center">№</th>
          <th style="text-align: center">X</th>
          <th style="text-align: center">Y</th>
        </tr>
        {{coordinates}}
      </table>
    </td>
  </tr>
</table>
