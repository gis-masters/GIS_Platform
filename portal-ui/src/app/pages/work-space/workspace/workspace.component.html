<div class="example-container">

  <mat-toolbar color="primary" style="position: absolute; min-height: 55px;">
    <mat-toolbar-row style="height: 55px;">
      <!--<img src="../../../../assets/images/logo.svg" alt="logo" height="50" width="115">-->

      <div style="padding-left: 400px">
        <crg-crg-stepper></crg-crg-stepper>
      </div>

      <span class="example-spacer"></span>

      <mat-icon class="crg-notification" (click)="notification()"
                *ngIf="notificationCounter == 0">notifications</mat-icon>
      <mat-icon class="crg-notification" matBadge="{{notificationCounter}}" matBadgeColor="warn"
                *ngIf="notificationCounter > 0"
                (click)="notification()">notifications</mat-icon>

      <button class="float-right" mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar-row>
  </mat-toolbar>

  <div class="fiz-container">
    <router-outlet></router-outlet>
  </div>
</div>

<mat-menu #menu="matMenu">
  <button mat-menu-item (click)="logout()">
    Выход
  </button>
</mat-menu>

<crg-info-sidebar [isActive]="isInfoSidebarActive"></crg-info-sidebar>
