<div class="loading-ng" [ngClass]="{ 'loading_no-backdrop': noBackdrop }">
  @if (hasPercents) {
    <div class="loading-ng__percents">{{ percents }}%</div>
  }
  @if (!hasPercents) {
    <mat-spinner></mat-spinner>
  }
  @if (hasPercents) {
    <mat-progress-spinner
      [value]="percents"
    ></mat-progress-spinner>
  }
</div>
