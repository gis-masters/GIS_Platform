<div [class]="cn({type: 'ready'})">
  <div [class]="cn('inner')">
    <mat-icon
        [ngClass]="cn('delete')"
        (click)="openDeleteDialog()">
      delete
    </mat-icon>
    <div [class]="cn('name')">
      {{project.internalName}}
    </div>
    <div [class]="cn('info')">
      Слоев загружено: {{project.layersCount}}
    </div>
  </div>
  <a [class]="cn('footer')" [routerLink]="link">
    Открыть
  </a>
</div>
