<div class="workspace-header">
  <a routerLink="/projects" class="workspace-header__back" mat-icon-button  matTooltip="Назад к выбору проекта">
    <mat-icon>arrow_back</mat-icon>
  </a>
  <div class="workspace-header__title">
    {{userModel?.orgName}}
  </div>
  <button class="workspace-header__user-icon" mat-button (click)="logout()">
    <mat-icon>logout</mat-icon>
    выйти
  </button>
</div>
