<div [class]="cn({visible: visible, open: open})" (contextmenu)="onContextMenu($event)">
  <div [class]="cn('menu-trigger')"
      [style.left]="contextMenuPosition.x"
      [style.top]="contextMenuPosition.y"
      [matMenuTriggerFor]="contextMenu"
      [matMenuTriggerData]="{layer: layer}">
  </div>

  <div [class]="cn('content', {visible: visible})">
    <ng-content></ng-content>

    <div [class]="cn('title')">
      {{layer.title}}
    </div>

    <button
        mat-icon-button
        [ngClass]="cn('visibility-trigger')"
        (click)="toggleVisibility()">
      <mat-icon>visibility{{visible ? '' : '_off'}}</mat-icon>
    </button>

    <button
        mat-icon-button
        [ngClass]="cn('openness-trigger', {open: open})"
        [disabled]="!visible"
        (click)="toggleOpenness()">
      <mat-icon>chevron_left</mat-icon>
    </button>
  </div>

  <div [class]="cn('extra', {open: open})">
    <mat-slider
        [ngClass]="cn('opacity-control')"
        min="0.1"
        max="1"
        step="0.05"
        [(ngModel)]="opacity">
    </mat-slider>
  </div>

  <!--  <div class="legend">({{getGeometryType(layer.name)}})</div>
  <div>
    <img [src]="imageToShow" alt="legend" height="20" width="20" *ngIf="isImageLoaded">
  </div>-->
</div>

<mat-menu #contextMenu="matMenu">
  <ng-template matMenuContent let-item="layer">

    <button mat-menu-item (click)="openAttributeTable()">
      <mat-icon>list_alt</mat-icon>
      <span>Открыть таблицу атрибутов</span>
    </button>

    <mat-divider></mat-divider>

    <button mat-menu-item (click)="export()">
      <mat-icon>archive</mat-icon>
      <span>Экспорт ESRI Shape-файл</span>
    </button>

    <button mat-menu-item (click)="delete()" *ngIf="!isSimf">
      <mat-icon>delete</mat-icon>
      <span>Удалить слой</span>
    </button>
  </ng-template>
</mat-menu>
