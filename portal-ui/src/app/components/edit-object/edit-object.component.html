<div class="container-fluid">
  <div *ngIf="!isFeatureTypeLoaded" class="fiz-loading-shade">
      <mat-spinner></mat-spinner>
  </div>

  <div class="row" style="padding-top: 5px; padding-bottom: 5px; background-color: gainsboro">
    <div class="col-12" style="padding-left: 5px; padding-right: 5px">
      <button mat-stroked-button (click)="close()" class="float-left">Отмена</button>
      <button mat-stroked-button color="primary" (click)="editFeature()" class="float-right">Сохранить</button>
    </div>
  </div>

  <div class="row edit-content scroll" *ngIf="isFeatureTypeLoaded">

    <form class="example-form col-md-12" [formGroup]="editFeatureForm" *ngIf="editFeatureData.length > 0">
      <div class="alert alert-danger" role="alert" *ngIf="objectValidationResult?.length > 0" style="margin-top: 5px">
        <span *ngFor="let error of objectValidationResult">{{error}}<br></span>
      </div>

      <div *ngFor="let editFeatureItem of editFeatureData">

        <div *ngIf="editFeatureItem.property?.valueType?.includes('STRING')" class="row fiz-edit-item">
          <div class="col-6 px-0 edit-item-title">{{editFeatureItem.property?.title}}</div>
          <div class="col-6 px-0">
            <div class="input-group">
              <input class="form-control" type="text" formControlName="{{editFeatureItem.name}}">
              <div class="input-group-append" *ngIf="!editFeatureForm.controls[editFeatureItem.name].valid">
                <span class="input-group-text error-badge">
                  <crg-errors-badge [errors]="editFeatureForm.controls[editFeatureItem.name].errors"></crg-errors-badge>
                </span>
              </div>
            </div>
          </div>
        </div>

        <div *ngIf="editFeatureItem.property?.valueType?.includes('INT')" class="row fiz-edit-item">
          <div class="col-6 px-0 edit-item-title">{{editFeatureItem.property?.title}}</div>
          <div class="col-6 px-0">
            <div class="input-group">
              <input class="form-control" type="text" formControlName="{{editFeatureItem.name}}">
              <div class="input-group-append" *ngIf="!editFeatureForm.controls[editFeatureItem.name].valid">
                <span class="input-group-text error-badge">
                  <crg-errors-badge [errors]="editFeatureForm.controls[editFeatureItem.name].errors"></crg-errors-badge>
                </span>
              </div>
            </div>
          </div>
        </div>

        <div *ngIf="editFeatureItem.property?.valueType?.includes('DOUBLE')" class="row fiz-edit-item">
          <div class="col-6 px-0 edit-item-title">{{editFeatureItem.property?.title}}</div>
          <div class="col-6 px-0">
            <div class="input-group">
              <input class="form-control" type="text" formControlName="{{editFeatureItem.name}}">
              <div class="input-group-append" *ngIf="!editFeatureForm.controls[editFeatureItem.name].valid">
                <span class="input-group-text error-badge">
                  <crg-errors-badge [errors]="editFeatureForm.controls[editFeatureItem.name].errors"></crg-errors-badge>
                </span>
              </div>
            </div>
          </div>
        </div>

        <div *ngIf="editFeatureItem.property?.valueType?.includes('CHOICE')" class="row fiz-edit-item">
          <div class="col-6 px-0 edit-item-title">{{editFeatureItem.property?.title}}</div>
          <div class="col-6 px-0">
            <div class="input-group">
              <select class="custom-select" formControlName="{{editFeatureItem.name}}">
                <option *ngFor="let enumOption of editFeatureItem.property.enumerations"
                        [value]="enumOption.value">
                  {{enumOption.title}}
                </option>
              </select>
              <div class="input-group-append" *ngIf="!editFeatureForm.controls[editFeatureItem.name].valid">
                <span class="input-group-text error-badge">
                  <crg-errors-badge [errors]="editFeatureForm.controls[editFeatureItem.name].errors"></crg-errors-badge>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>

<!--      <br>-->
<!--      <pre>-->
<!--          Form valid: {{editFeatureForm.valid}}-->
<!--          Form dirty: {{editFeatureForm.dirty}}-->
<!--          Form errors: {{editFeatureForm.errors | json }}-->
<!--      </pre>-->
    </form>
  </div>
</div>
