<div [class]="cn()">
  <div id="fiz-openLayer-map" [class]="cn('map')">
    <crg-search></crg-search>
  </div>

  <crg-layers-sidebar [class]="cn('bar', { dir: 'left' })"> </crg-layers-sidebar>

  <crg-report-sidebar [class]="cn('bar', { dir: 'right' })" *ngIf="isBugReportSidebarActive"> </crg-report-sidebar>
  <crg-view-features [class]="cn('bar', { dir: 'right' })" *ngIf="isFeaturesSidebarActive"> </crg-view-features>

  <crg-attributes-bar [class]="cn('bar', { dir: 'bottom' })" *ngIf="isAttrSidebarActive"> </crg-attributes-bar>
</div>

<p-dialog header="Проверка данных" [style]="{ width: '450px', height: '500px' }" [(visible)]="isValidationDialogShow">
  <crg-validation-dialog [data]="validationDialogData"> </crg-validation-dialog>
</p-dialog>

<p-dialog header="Экспорт" [style]="{ width: '450px', height: '500px' }" [(visible)]="isGmlDialogShow">
  <crg-export-dialog></crg-export-dialog>
</p-dialog>
