<div [class]="cn()">
  <div id="fiz-openLayer-map" [class]="cn('map')">
    <crg-search></crg-search>
    <crg-base-maps-select></crg-base-maps-select>
  </div>

  <crg-layers-sidebar [class]="cn('bar', { dir: 'left' })"> </crg-layers-sidebar>

  <crg-edit-features-sidebar [class]="cn('bar', { dir: 'right' })" *ngIf="isEditSidebarActive">
  </crg-edit-features-sidebar>
  <crg-features-list-sidebar [class]="cn('bar', { dir: 'right' })" *ngIf="isFeaturesSidebarActive">
  </crg-features-list-sidebar>
  <crg-report-sidebar
    [class]="cn('bar', { dir: 'right' })"
    *ngIf="isBugReportSidebarActive"
    [isActive]="isBugReportSidebarActive"
  >
  </crg-report-sidebar>

  <crg-attributes-bar [class]="cn('bar', { dir: 'bottom' })" *ngIf="isAttrSidebarActive"> </crg-attributes-bar>
</div>
