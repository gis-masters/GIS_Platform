<div class="progress-item">
  <div class="progress-icon">
    <mat-spinner class="crg-spinner crg-center" *ngIf="event.payload.payload.status === 'PENDING'"></mat-spinner>
    <mat-icon class="crg-progress-done success" *ngIf="event.payload.payload.status === 'DONE'">done_all</mat-icon>
    <mat-icon class="crg-progress-done error" *ngIf="event.payload.payload.status === 'ERROR'">error_outline</mat-icon>
  </div>

  <div class="progress-content">
    <div class="cut-text">{{getDescription()}}</div>
    <div class="content-action" *ngIf="isShowActionBlock()">
      <div *ngIf="isShowDownloadLink()" style="float: left">
        <mat-icon class="content-link-icon" (click)="download()">archive</mat-icon>
        <span class="content-link-text">Скачать GML файл</span>
      </div>
      <mat-icon class="info-close-icon" (click)="closeNotice()">delete</mat-icon>
    </div>
  </div>
</div>
