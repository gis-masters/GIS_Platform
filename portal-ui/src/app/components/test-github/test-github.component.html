<div *ngIf="data?.length === 0 && !isLoadingResults">
  <div *ngIf="status === 'DONE'">
    <h6 class="float-left" style="font-size: inherit">Ошибок нет</h6>
    <h6 class="float-right" style="font-size: inherit">Время последней проверки: 2019.02.05</h6>
  </div>
  <div *ngIf="status === 'ERROR'">
    <h6 class="float-left" style="font-size: inherit">Ошибка валидации</h6>
  </div>
</div>

<div class="validation-results-container mat-elevation-z8" [hidden]="data?.length === 0 && !isLoadingResults">
  <div class="example-loading-shade" *ngIf="isLoadingResults">
    <mat-spinner></mat-spinner>
  </div>

  <div [hidden]="data?.length === 0">
    <div class="validation-results-table-container">

      <table mat-table [dataSource]="data" class="example-table" multiTemplateDataRows
             matSort matSortActive="created" matSortDisableClear matSortDirection="desc">

        <ng-container matColumnDef="objectid">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let element">{{element.objectId}}</td>
        </ng-container>

        <ng-container matColumnDef="violationAsString">
          <th mat-header-cell *matHeaderCellDef style="padding-left: 10px">Название</th>
          <td mat-cell *matCellDef="let element" style="padding-left: 10px">Описание обьекта по classid</td>
        </ng-container>

        <ng-container matColumnDef="violationAsString2">
          <th mat-header-cell *matHeaderCellDef style="padding-left: 10px">Кол-во ошибок</th>
          <td mat-cell *matCellDef="let element" style="padding-left: 10px">2</td>
        </ng-container>

        <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
        <ng-container matColumnDef="expandedDetail">
          <td mat-cell *matCellDef="let element" [attr.colspan]="displayedColumns.length">
            <div class="example-element-detail"
                 [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">

              <crg-violation-item-view [data]="element.violationAsString"></crg-violation-item-view>

              <!--<div class="example-element-diagram">-->
                <!--<div class="example-element-position"> {{element.position}} </div>-->
                <!--<div class="example-element-symbol"> {{element.symbol}} </div>-->
                <!--<div class="example-element-name"> {{element.name}} </div>-->
                <!--<div class="example-element-weight"> {{element.weight}} </div>-->
              <!--</div>-->
              <!--<div class="example-element-description">-->
                <!--{{element.description}}-->
                <!--<span class="example-element-description-attribution"> &#45;&#45; Hi from expanded element! </span>-->
              <!--</div>-->

            </div>
          </td>
        </ng-container>

        <!--<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>-->
        <!--<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>-->

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let element; columns: displayedColumns;"
            class="example-element-row"
            [class.example-expanded-row]="expandedElement === element"
            (click)="expandedElement = expandedElement === element ? null : element">
        </tr>

        <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
      </table>
    </div>

    <mat-paginator [length]="totalElements"
                   [pageSize]="10" [pageSizeOptions]="[10, 25, 50, 100]"></mat-paginator>
  </div>
</div>
