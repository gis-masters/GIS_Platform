<div class="header">
  <crg-logo></crg-logo>

  <div *ngIf="envPlatform === 'conv'" class="header__buttons">
    <button class="header__button header__button_type_how" mat-raised-button (click)="how()">Как это работает?</button>
    <button class="header__button header__button_type_login" mat-raised-button (click)="login()">Войти</button>
    <button class="header__button header__button_type_reg" mat-raised-button (click)="register()">
      Зарегистрироваться
    </button>
  </div>
</div>
