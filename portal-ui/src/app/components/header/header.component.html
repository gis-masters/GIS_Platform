<div class="header">
  <crg-logo-ng></crg-logo-ng>

  @if (envPlatform === 'conv') {
    <div class="header__buttons">
      <a routerLink="/about">
        <button
          class="header__button header__button_type_how"
          mat-raised-button
          >
          Как это работает?
        </button>
      </a>
      @if (currentPage !== 'register') {
        <a routerLink="/register">
          @if (envRegistration) {
            <button
              class="header__button header__button_type_reg"
              mat-raised-button
              >
              Зарегистрироваться
            </button>
          }
        </a>
      }
      @if (currentPage === 'register') {
        <a routerLink="/">
          @if (envRegistration) {
            <button
              class="register-header__button register-header__button_type_reg"
              mat-raised-button
              >
              Войти
            </button>
          }
        </a>
      }
    </div>
  }
</div>
