<div class="data-import">
  <div class="data-import__dz-container">
    <div ng2FileDrop
        [ngClass]="{'data-import__dz_file-over': hasBaseDropZoneOver}"
        (fileOver)="fileOverBase($event)"

        (onFileDrop)="fileSelectedHandler()"
        [uploader]="uploader"
        class="data-import__dz">

      <div class="data-import__dz-caption">
        Перетащите zip архив с shape файлами<br>или<br>
        <button mat-raised-button
               (click)="fileInput.click()"
               class="data-import__dz-file-button">
          Откройте проводник для выбора файла
        </button>
        <div class="data-import__dz-control-container">
          <input type="file" #fileInput ng2FileSelect [uploader]="uploader" (onFileSelected)="fileSelectedHandler()" />
        </div>
      </div>
    </div>

    <crg-loading *ngIf="isImportInited"></crg-loading>

    <div *ngIf="uploader?.queue?.length" class="data-import__dz-files">
      <div class="data-import__dz-file">
        <div class="data-import__dz-file-name">
          {{uploader.queue[0]._file.name}}
        </div>
        <div class="data-import__dz-file-size">
          {{uploader.queue[0].file?.size/1024/1024 | atleast: 0.001 | number:'.2'}} MB
        </div>
        <button class="data-import__dz-file-del" mat-icon-button color="primary" (click)="clearFiles()">
          <mat-icon color="warn">delete</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="data-import__notifications">
      <div *ngIf="isWrongExt" class="data-import__notification data-import__notification_error">
        Неверный формат файла
      </div>

      <div *ngIf="isImportFailed" class="data-import__notification data-import__notification_error">
        Не удается загрузить архив, проверьте вложенные файлы.
      </div>

      <crg-data-import-tasks-list *ngIf="errorTasks && errorTasks.length" [tasks]="errorTasks">
      </crg-data-import-tasks-list>

    <div *ngIf="isUploadComplete" class="data-import__notification data-import__notification_success">
      Файл успешно загружен. Нажмите "Далее" для продолжения."
    </div>
  </div>

  <div class="data-import__row-buttons">
    <button mat-stroked-button routerLink="/workspace/projects">
        Вернуться к выбору проекта
    </button>
    <button mat-raised-button class="mat-primary" [disabled]="!isUploadComplete" (click)="next()">
        Далее
    </button>
  </div>
</div>
