<div [ngClass]="isActive? 'crg-view-features-sidebar' : 'crg-view-features-sidebar_hidden'">
  <div class="crg-sidebar-header">
    <mat-icon class="crg-close-icon" (click)="closeMe()">close</mat-icon>
    Обьекты
  </div>

  <ng-container *ngIf="features; else noFeatures">
    Выделено {{features.length}} обьектов
  </ng-container>

  <ng-template #noFeatures>
    <div class="col-12 text-center">
      Обьекты не выбраны
    </div>
  </ng-template>
</div>
