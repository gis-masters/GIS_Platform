<div *ngIf="dataSource?.data.length === 0 && !isLoadingResults">
  <div *ngIf="status === 'DONE'">
    <h6 class="float-left" style="font-size: inherit">Ошибок нет</h6>
    <h6 class="float-right" style="font-size: inherit">Время последней проверки: 2019.02.05</h6>
  </div>
  <div *ngIf="status === 'ERROR'">
    <h6 class="float-left" style="font-size: inherit">Ошибка валидации</h6>
  </div>
</div>

<div class="validation-results-container mat-elevation-z2">
  <div class="example-loading-shade" *ngIf="isLoadingResults">
    <mat-spinner *ngIf="isLoadingResults"></mat-spinner>
  </div>

  <table mat-table multiTemplateDataRows
         matSort matSortActive="objectid" matSortDisableClear matSortDirection="desc"
         [dataSource]="dataSource"
         *ngIf="dataSource?.data.length > 0">
    <ng-container matColumnDef="objectid">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let element">{{element.objectId}}</td>
    </ng-container>

    <ng-container matColumnDef="violationAsString">
      <th mat-header-cell *matHeaderCellDef style="padding-left: 10px">Ошибки</th>
      <td mat-cell *matCellDef="let element" style="padding-left: 10px">{{element.violationAsString}}</td>
    </ng-container>

    <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
    <ng-container matColumnDef="expandedDetail">
      <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplay.length">
        <div class="example-element-detail"
             [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
          <div class="example-element-diagram">
            <div class="example-element-position"> {{element.position}} </div>
            <div class="example-element-symbol"> {{element.symbol}} </div>
            <div class="example-element-name"> {{element.name}} </div>
            <div class="example-element-weight"> {{element.weight}} </div>
          </div>
          <div class="example-element-description">
            {{element.description}}
            <span class="example-element-description-attribution"> -- Wikipedia </span>
          </div>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
    <tr mat-row *matRowDef="let element; columns: columnsToDisplay;"
        class="example-element-row"
        [class.example-expanded-row]="expandedElement === element"
        (click)="expandedElement = expandedElement === element ? null : element">
    </tr>

    <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
  </table>

  <mat-paginator [length]="totalElements"
                 [pageSize]="20"
                 *ngIf="dataSource?.data.length > 0"></mat-paginator>
<!--  <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" [pageSize]="10"-->
<!--                 [length]="totalElements"-->
<!--                 *ngIf="dataSource?.data.length > 0"></mat-paginator>-->
</div>
