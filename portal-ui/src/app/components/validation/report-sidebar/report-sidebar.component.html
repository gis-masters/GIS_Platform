<div [ngClass]="isActive? 'crg-validation-sidebar' : 'crg-validation-sidebar_hidden'">
  <div class="crg-report-sidebar-header" *ngIf="!isEditMode">
    <button mat-mini-fab color="primary" class="revalidation-b" (click)="reValidate()">
      <mat-icon>loop</mat-icon>
    </button>
    Валидация
    <mat-icon class="crg-close-icon" (click)="closeMe()">close</mat-icon>
  </div>

  <div class="crg-report-sidebar-content scroll">
    <div *ngIf="!isEditMode">
      <div class="container-fluid">
        <div class="row">
          <div class="fiz-loading-shade" *ngIf="isValidationInited">
            <mat-progress-spinner [value]="commonProgress"></mat-progress-spinner>
          </div>

          <div class="h-100" style="width: 100%">

            <mat-accordion class="validation_accordion">
              <mat-expansion-panel *ngFor="let layer of layers; let index = index"
                                   [expanded]="step === (index+1)" (opened)="setStep(index+1)" hideToggle>
                <mat-expansion-panel-header>
                  <mat-panel-title>
                    <div style="position: relative; top: 4px">
                      <mat-icon *ngIf="commonInfo.get(layer.name)?.total > 0" style="color: tomato">error</mat-icon>
                      <mat-icon *ngIf="!commonInfo.get(layer.name)?.validated" style="color: lightgrey">warning</mat-icon>
                      <mat-icon *ngIf="commonInfo.get(layer.name)?.validated && commonInfo.get(layer.name)?.total < 1"
                                style="color: forestgreen">done</mat-icon>
                    </div>
                    <span style="padding-left: 10px">{{layer.title}} ({{getGeometryType(layer.name)}})</span>
                  </mat-panel-title>

                  <div class="float-right" *ngIf="!!commonInfo.get(layer.name)">
                    <div *ngIf="commonInfo.get(layer.name)?.total">
                      <mat-chip-list>
                        <mat-chip style="color: tomato">{{commonInfo.get(layer.name)?.total}}</mat-chip>
                      </mat-chip-list>
                    </div>
                  </div>
                </mat-expansion-panel-header>

                <div>
                  <crg-bugs-table [crgLayer]="layer"
                                  [step]="step" [index]="index + 1" [isActive]="isActive"></crg-bugs-table>
                </div>

                <mat-action-row style="padding: 0">
                  <button mat-button *ngIf="index > 0" color="warn" (click)="prevStep()">Предыдущий</button>
                  <button mat-button *ngIf="index < (layers.length - 1) " color="primary" (click)="nextStep()">Следующий</button>
                  <button mat-button *ngIf="index == (layers.length - 1) " color="primary" (click)="nextStep()">Закончить</button>
                </mat-action-row>
              </mat-expansion-panel>
            </mat-accordion>

          </div>
        </div>
      </div>
    </div>
    <div style="height: 70px; width: 100%" *ngIf="!isEditMode"></div>

    <div *ngIf="isEditMode">
      <crg-edit-object [data]="objectsToEdit" (closeMe)="switchMode()"></crg-edit-object>
    </div>
  </div>
</div>
