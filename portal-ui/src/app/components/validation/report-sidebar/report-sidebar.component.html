<div>
  <mat-icon (click)="closeSidebar()" class="report-close-icon">close</mat-icon>
  <button mat-mini-fab color="primary" class="float-right" (click)="reValidate()"
          style="margin-top: 2px; margin-right: 2px">
    <mat-icon>loop</mat-icon>
  </button>
</div>

<div *ngIf="isValidationInited" style="text-align: -webkit-center; margin-top: 30px">
  <mat-spinner></mat-spinner>
</div>
<div *ngIf="!isValidationInited">
  <mat-accordion class="validation_accordion">
    <mat-expansion-panel *ngFor="let layer of layers; let index = index"
                         [expanded]="step === (index+1)" (opened)="setStep(index+1)" hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <div style="position: relative; top: 4px">
            <mat-icon *ngIf="getInfo(layer.name, 'totalViolations') > 0" style="color: tomato">error</mat-icon>
            <mat-icon *ngIf="!getInfo(layer.name, 'isValidated')" style="color: lightgrey">warning</mat-icon>
            <mat-icon *ngIf="isValidatedAndSuccess(layer.name)" style="color: forestgreen">done</mat-icon>
          </div>
          <span style="position: relative; top: 5px; padding-left: 10px">{{layer.title}}</span>
        </mat-panel-title>

        <div class="float-right" *ngIf="isLayerCommonInfoExist(layer.name, 'totalViolations')">
          <div *ngIf="getInfo(layer.name, 'isValidated')">
            <mat-chip-list *ngIf="getInfo(layer.name, 'totalViolations') > 0">
              <mat-chip style="color: tomato">{{getInfo(layer.name, 'totalViolations')}}</mat-chip>
            </mat-chip-list>
          </div>
        </div>
      </mat-expansion-panel-header>

      <div>
        <crg-bugs-table [connectionInfo]="connectionInfo.get(layer.name)"
                        [step]="step" [index]="index + 1" [isActive]="isActive"
                        (getConnectionInfo)="handleChildEvent($event)"></crg-bugs-table>
      </div>

      <mat-action-row style="padding: 0">
        <button mat-button *ngIf="index > 0" color="warn" (click)="prevStep()">Предыдущий</button>
        <button mat-button *ngIf="index < (layers.length - 1) " color="primary" (click)="nextStep()">Следующий</button>
        <button mat-button *ngIf="index == (layers.length - 1) " color="primary" (click)="nextStep()">Закончить</button>
      </mat-action-row>
    </mat-expansion-panel>
  </mat-accordion>
</div>
