@if (data) {
  <div class="fiz-box">
    <mat-nav-list role="list">
      @for (item of violationItems; track item) {
        <mat-list-item role="listitem">
          <div class="fiz-inner">
            <div class="prop-title">
              {{ item.propertyName }}
            </div>
            <div class="prop-error">
              {{ item.errors }}
            </div>
          </div>
        </mat-list-item>
      }
    </mat-nav-list>
  </div>
}
