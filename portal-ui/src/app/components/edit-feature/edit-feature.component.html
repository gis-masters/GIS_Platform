<div class="container-fluid">
  <div class="row" style="padding-top: 5px; padding-bottom: 5px; background-color: gainsboro">
    <div class="col-12" style="padding-left: 5px; padding-right: 5px">
      <button mat-stroked-button color="primary" (click)="editFeature()" class="float-left">Сохранить</button>
      <button mat-stroked-button (click)="close()" class="float-right">Отмена</button>
    </div>
  </div>

  <div class="row edit-content scroll">

    <form class="example-form col-md-12" [formGroup]="editFeatureForm">
      <div *ngFor="let property of fProperties">

        <div class="row fiz-edit-item">
          <div class="col-6 px-0 edit-item-title">{{getAlias(property)}}</div>
          <div class="col-6 px-0">
            <div class="input-group">
              <input class="form-control" type="text" formControlName="{{property}}">
              <div class="input-group-append"></div>
            </div>
          </div>
        </div>

      </div>
    </form>
  </div>
</div>
