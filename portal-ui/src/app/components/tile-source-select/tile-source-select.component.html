<ng-select class="tile-source-select"
          [ngClass]="class"
          [items]="tileSources"
          [(ngModel)]="selectedTileSource"
          bindLabel="title"
          [searchable]="false"
          [clearable]="false"
          [clearOnBackspace]="false"
          (click)="onChange()">
  <ng-template ng-label-tmp let-item="item">
    <img [src]="item.thumbnail" class="tile-source-select__thumbnail" />
    {{item.title}}
  </ng-template>
  <ng-template ng-option-tmp let-item="item" let-index="index" let-search="searchTerm">
      <img [src]="item.thumbnail" class="tile-source-select__thumbnail" />
      {{item.title}}
  </ng-template>
</ng-select>
