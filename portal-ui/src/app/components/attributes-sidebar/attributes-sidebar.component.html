<div class="crg-attr-sidebar">
  <div class="crg-attr-sidebar-header">
    <mat-icon class="crg-close-icon" (click)="closeMe()">close</mat-icon>
    <span class="layerTitle">{{layer.title}}</span>
  </div>

  <div class="crg-attr-content">
<!--    <div *ngIf="!loading" style="width: 100%; text-align: -webkit-center">-->
<!--      <mat-spinner></mat-spinner>-->
<!--    </div>-->

    <ngx-datatable class="bootstrap" style="height: 100%;"
                   [rows]="features"
                   [columns]="columns"
                   [columnMode]="'force'"
                   [rowHeight]="25"
                   [footerHeight]="40"
                   [selected]="selectedFeatures"
                   [selectionType]="'multi'"

                   [loadingIndicator]="loading"

                   [externalPaging]="true"
                   [externalSorting]="true"
                   [count]="totalFeatures"
                   [offset]="pageInfo.offset"
                   [limit]="pageInfo.pageSize"

                   (page)='setPage($event)'
                   (sort)="onSort($event)"
                   (select)='onSelect($event)'

                   [scrollbarH]="true">
    </ngx-datatable>
  </div>

</div>
