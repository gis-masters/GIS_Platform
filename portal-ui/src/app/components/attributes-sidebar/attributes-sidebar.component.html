<div class="crg-attr-sidebar">
  <div class="crg-attr-sidebar-header">
    <span class="layerTitle">{{layer.title}}</span>

    <div class="right-side">
      <mat-icon class="attr-table-action-icon" (click)="closeMe()">close</mat-icon>

      <mat-icon [ngClass]="enableFilter ? 'crg-filter-icon-active fiz-border' : 'crg-filter-icon fiz-border'"
                (click)="switchFilter()">filter_list</mat-icon>

      <mat-icon class="attr-table-action-icon fiz-border" (click)="editFeatures()">edit</mat-icon>
      <mat-icon class="attr-table-action-icon fiz-border" (click)="copyObjects()">shuffle</mat-icon>

<!--      <mat-select class="view-mode-selector fiz-border" [(ngModel)]="viewSettings.viewMode"-->
<!--                  (selectionChange)="onViewModeChange($event)">-->
<!--        <mat-option value="internal">Исходные данные</mat-option>-->
<!--        <mat-option value="alias">Псевдонимы</mat-option>-->
<!--      </mat-select>-->
    </div>
  </div>

  <div class="crg-attr-content">
    <div *ngIf="loading" class="fiz-loading-shade">
      <mat-spinner></mat-spinner>
    </div>

    <ngx-datatable [ngClass]="{'bootstrap': enableFilter, 'fiz-bootstrap': !enableFilter}"
                   [rows]="features"
                   [columns]="columns"
                   [columnMode]="'force'"
                   [rowHeight]="20"
                   [footerHeight]="40"
                   [selectionType]="'checkbox'"
                   [selectAllRowsOnPage]="false"
                   [trackByProp]="'updated'"

                   [externalPaging]="true"
                   [externalSorting]="true"
                   [count]="totalFeatures"
                   [offset]="pageInfo.offset"
                   [limit]="pageInfo.pageSize"

                   [rowIdentity]="customRowIdentity"

                   (page)='setPage($event)'
                   (sort)="onSort($event)"
                   (select)='onSelect($event)'
                   (activate)="onActivate($event)"

                   [virtualization]="false"
                   [scrollbarV]="true"
                   [scrollbarH]="true">
    </ngx-datatable>

    <ng-template #cellTemplate let-row="row" let-value="value">
      <div *ngIf="currentPositionFeature?.id === row.id">
        >
      </div>
    </ng-template>

    <ng-template #filterTemplate let-column="column" let-sort="sortFn" let-sortDir="sortDir"
                 ngx-datatable-header-template>
      <div (click)="sort($event, sortDir, sortFn)">
        <div class="cut-text w-95 cur-p">{{column.name}}</div>
        <div class="sort-btn"></div>
      </div>

      <crg-table-filter *ngIf="enableFilter" [property]="getSimpleProperty(column.prop.split('.')[1])"
                        (filterEvent)="onFilterChange($event)"></crg-table-filter>
    </ng-template>
  </div>

</div>
