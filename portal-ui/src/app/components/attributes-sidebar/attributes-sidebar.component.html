<div class="crg-attr-sidebar">
  <div class="crg-attr-sidebar-header">
    <mat-icon class="crg-close-icon" (click)="closeMe()">close</mat-icon>
    <span class="layerTitle">{{layer.title}}</span>
  </div>

  <div class="crg-attr-content">
    <p-table [columns]="cols" [value]="features" selectionMode="multiple" [(selection)]="selectedFeatures"
             [metaKeySelection]="true" [resizableColumns]="true"
             [lazy]="true" (onLazyLoad)="loadObjectsLazy($event)"
             [paginator]="true" [rows]="20" [totalRecords]="totalFeatures"
             [loading]="loading"
             [scrollable]="true" [style]="{width:'100%'}" scrollHeight="315px"
             (onRowSelect)="handleSelection()" (onRowUnselect)="handleSelection()">

      // COLUMN STYLING
      <ng-template pTemplate="colgroup" let-columns>
        <colgroup>
          <col *ngFor="let col of columns" style="width: 310px">
        </colgroup>
      </ng-template>

      // HEADER
      <ng-template pTemplate="header" let-columns>
        <tr>
          <th *ngFor="let col of columns" pResizableColumn [pSortableColumn]="col.field">
            {{col.header}}
            <p-sortIcon [field]="col.field" *ngIf="col.field !== 'objectid'"></p-sortIcon>
          </th>
        </tr>
      </ng-template>

      // BODY
      <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex"
                   class="ui-resizable-column">
        <tr [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex">
          <td *ngFor="let col of columns">
            {{rowData[col.field]}}
          </td>
        </tr>
      </ng-template>

    </p-table>
  </div>

</div>
