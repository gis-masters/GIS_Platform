<div class="crg-attr-sidebar">
  <div class="crg-attr-sidebar-header">
    <mat-icon class="crg-close-icon" (click)="closeMe()">close</mat-icon>
    <span class="layerTitle">{{layer.title}}</span>

    <mat-icon [ngClass]="{'crg-filter-icon-active': enableFilter, 'crg-filter-icon': !enableFilter}"
              (click)="switchFilter()">filter_list</mat-icon>
  </div>

  <div class="crg-attr-content">
    <div *ngIf="loading" class="fiz-loading-shade">
      <mat-spinner></mat-spinner>
    </div>

    <ngx-datatable [ngClass]="{'bootstrap': enableFilter, 'fiz-bootstrap': !enableFilter}"
                   [rows]="features"
                   [columns]="columns"
                   [columnMode]="'force'"
                   [rowHeight]="20"
                   [footerHeight]="40"
                   [selectionType]="'multi'"

                   [externalPaging]="true"
                   [externalSorting]="true"
                   [count]="totalFeatures"
                   [offset]="pageInfo.offset"
                   [limit]="pageInfo.pageSize"

                   [rowIdentity]="customRowIdentity"

                   (page)='setPage($event)'
                   (sort)="onSort($event)"
                   (select)='onSelect($event)'
                   (activate)="onActivate($event)"

                   [virtualization]="false"
                   [scrollbarV]="true"
                   [scrollbarH]="true">
    </ngx-datatable>

    <ng-template #cellTemplate let-row="row" let-value="value">
      <div *ngIf="currentPositionFeature?.id === row.id">
        >
      </div>
    </ng-template>

    <ng-template #filterTemplate let-column="column" let-sort="sortFn" let-sortDir="sortDir"
                 ngx-datatable-header-template>
      <div class="mobile-hidden" (click)="sort($event, sortDir, sortFn)">
        <span style="cursor: pointer">{{column.name}}</span>
        <span class="sort-btn"></span>
      </div>

      <crg-table-filter *ngIf="enableFilter" [property]="getProperty(column.name)"
                        (filterEvent)="onFilterChange($event)"></crg-table-filter>
    </ng-template>
  </div>

</div>
