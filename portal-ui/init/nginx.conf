server {
  listen  80;
  server_name  localhost;
  root /usr/share/nginx/html;

  location /assets/ {
    try_files $uri$args $uri$args/ =404;
  }

  location /reglaments/ {
    add_header "Access-Control-Allow-Origin" *;
    try_files $uri$args $uri$args/ =404;
  }

  location / {
    try_files $uri$args $uri$args/ /index.html;
  }
}
