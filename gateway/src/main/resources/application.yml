spring:
  profiles:
    active: fiz-dev
logging:
  file: /opt/logs/gateway.log
  level:
    ru.mycrg: DEBUG

---

spring:
  profiles: fiz-dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://crg-registry:8761/eureka/

hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 20000

ribbon:
  ReadTimeout: 20000
  ConnectTimeout: 20000

zuul:
  #  prefix: /api
  #  include-debug-header: true
  ignoredServices: '*'
  sensitive-headers: Cookie,Set-Cookie
  routes:
    auth-service:
      path: /oauth/token/**
      service-id: http://jwt-service:9000/oauth/token

    # Our API
    gis-projects:
      path: /projects/**
      url: http://geo-api:8088/projects/

    gis-ws:
      path: /crg-ws-endpoint/**
      url: http://geo-api:8088/crg-ws-endpoint/

    gis-rules:
      path: /fgistp/**
      url: http://geo-api:8088/fgistp/

    gis-organizations:
      path: /organizations/**
      url: http://geo-api:8088/organizations/

    # Geoserver
    geoserver:
      path: /geoserver/**
      serviceId: http://geoserver:8080/geoserver/

server:
  port: 8100
