server:
  port: 8100

spring:
  servlet:
    multipart:
      max-file-size: 1001MB
      max-request-size: 1001MB

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: crg-auth-service-groups
              uri: http://auth-service:9000
              predicates:
                - Path=/groups/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: crg-auth-service-users
              uri: http://auth-service:9000
              predicates:
                - Path=/users/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: crg-auth-service-roles
              uri: http://auth-service:9000
              predicates:
                - Path=/roles/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: crg-auth-service-organizations
              uri: http://auth-service:9000
              predicates:
                - Path=/organizations/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: crg-auth-service-specializations
              uri: http://auth-service:9000
              predicates:
                - Path=/specializations,/specializations/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: crg-auth-service-esia
              uri: http://auth-service:9000
              predicates:
                - Path=/esia/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: crg-auth-service-password-reset-request
              uri: http://auth-service:9000
              predicates:
                - Path=/request-password-reset,/request-password-reset/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: crg-auth-service-password-reset
              uri: http://auth-service:9000
              predicates:
                - Path=/password-reset,/password-reset/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: crg-gis-service-projects
              uri: http://crg-gis-service:8082
              predicates:
                - Path=/projects/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
            - id: crg-gis-service-specializations
              uri: http://crg-gis-service:8082
              predicates:
                - Path=/gis/specializations/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
            - id: crg-gis-service-export
              uri: http://crg-gis-service:8082
              predicates:
                - Path=/gis/export/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
            - id: crg-gis-integration-resource-analyzers
              uri: http://crg-integration-service:8338
              predicates:
                - Path=/resource-analyzers/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
            - id: crg-data-service-projects
              uri: http://crg-data-service:8084
              predicates:
                - Path=/api/data/**
              filters:
                - StripPrefix=2
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
            - id: crg-data-service-integration-statement
              uri: http://crg-data-service:8084
              predicates:
                - Path=/integration/statement/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
            - id: crg-data-service-integration-smev3-request
              uri: http://crg-data-service:8084
              predicates:
                - Path=/integration/smev3/request/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
            - id: gis-ws
              uri: http://crg-data-service:8084
              predicates:
                - Path=/crg-ws-endpoint/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
            - id: crg-audit-service
              uri: http://crg-audit-service:8086
              predicates:
                - Path=/events/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
            - id: crg-report-service
              uri: http://crg-report-service:8090
              predicates:
                - Path=/reports/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
            - id: crg-report-templates
              uri: http://crg-report-service:8090
              predicates:
                - Path=/templates/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie
            - id: geoserver
              uri: http://geoserver:8080
              predicates:
                - Path=/geoserver/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Set-Cookie

logging:
  level:
    ru.mycrg: DEBUG
  file:
    name: /opt/crg/logs/gateway.log

crg-options:
  auth-service-url: ${CRG_OPTIONS_AUTH_SERVICE_URL}
  auth-method: COOKIE_BEARER
  jwt:
    secret: ${CRG_OPTIONS_JWT_SECRET}
    client-id: ${CRG_OPTIONS_JWT_CLIENT_ID}
    client-secret: ${CRG_OPTIONS_JWT_CLIENT_SECRET}
